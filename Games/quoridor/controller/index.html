<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
	<title>Quoridor</title>
	<link rel="stylesheet" href="/styles.css">
	<link rel="stylesheet" href="style.css">
</head>
<body class="playful-game game-royal game-garden game-controls-roomy">
	<main class="game-controller game-heading-compact">
		<header>
			<h1 class="sr-only">Quoridor</h1>
			<img class="game-title-art" src="/game/quoridor/art/title.svg" alt="">
			<p id="connection" role="status">Connecting...</p>
			<p id="status" class="game-status game-status-reserved" role="status">Waiting for the host...</p>
		</header>
		<div class="game-arena">
			<div class="game-score-stack">
				<aside class="game-score-card game-ornate game-compact-stats">
					<p id="one-player">Player one</p>
					<div class="game-illustrated-stat"><img src="/ui/playful/stat-wins.svg" alt=""><output id="one-score" aria-label="Player one's session wins">0 WINS</output></div>
					<div class="game-illustrated-stat"><img src="/ui/playful/stat-walls.svg" alt=""><span id="one-walls" aria-label="Player one's remaining walls">10 WALLS</span></div>
				</aside>
				<aside class="game-score-card game-ornate game-compact-stats" hidden>
					<p id="three-player">Player three</p>
					<div class="game-illustrated-stat"><img src="/ui/playful/stat-wins.svg" alt=""><output id="three-score" aria-label="Player three's session wins">0 WINS</output></div>
					<div class="game-illustrated-stat"><img src="/ui/playful/stat-walls.svg" alt=""><span id="three-walls" aria-label="Player three's remaining walls">5 WALLS</span></div>
				</aside>
			</div>
			<section class="game-playfield">
				<div id="board" role="group" aria-label="Quoridor board"></div>
				<div id="controls" class="game-board-controls game-action-row game-action-compact game-action-single-row">
					<button id="move" class="game-primary game-compact-control game-icon-control" aria-pressed="true" disabled><img src="/ui/playful/control-move.svg" alt=""><span>MOVE</span></button>
					<button id="wall" class="game-compact-control game-icon-control" aria-pressed="false" disabled><img src="/ui/playful/control-wall.svg" alt=""><span>WALL</span></button>
					<button id="confirm" class="game-primary game-compact-control game-icon-control" aria-label="Place previewed wall" hidden disabled><img src="/ui/playful/control-wall.svg" alt=""><span>PLACE</span></button>
					<button id="rotate" class="game-compact-control game-icon-control" aria-label="Rotate wall to vertical" disabled><img src="/ui/playful/control-rotate.svg" alt=""><span>ROTATE</span></button>
				</div>
				<button id="replay" class="game-primary" hidden>PLAY AGAIN</button>
			</section>
			<div class="game-score-stack">
				<aside class="game-score-card game-ornate game-compact-stats">
					<p id="two-player">Player two</p>
					<div class="game-illustrated-stat"><img src="/ui/playful/stat-wins.svg" alt=""><output id="two-score" aria-label="Player two's session wins">0 WINS</output></div>
					<div class="game-illustrated-stat"><img src="/ui/playful/stat-walls.svg" alt=""><span id="two-walls" aria-label="Player two's remaining walls">10 WALLS</span></div>
				</aside>
				<aside class="game-score-card game-ornate game-compact-stats" hidden>
					<p id="four-player">Player four</p>
					<div class="game-illustrated-stat"><img src="/ui/playful/stat-wins.svg" alt=""><output id="four-score" aria-label="Player four's session wins">0 WINS</output></div>
					<div class="game-illustrated-stat"><img src="/ui/playful/stat-walls.svg" alt=""><span id="four-walls" aria-label="Player four's remaining walls">5 WALLS</span></div>
				</aside>
			</div>
		</div>
	</main>
	<script src="/controller-sdk.js"></script>
	<script src="/game-celebration.js"></script>
	<script src="controller.js"></script>
</body>
</html>
