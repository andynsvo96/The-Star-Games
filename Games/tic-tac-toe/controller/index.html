<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Tic Tac Toe</title><link rel="stylesheet" href="/styles.css"><link rel="stylesheet" href="style.css"></head>
<body class="playful-game"><main class="game-controller"><header><h1 class="game-wordmark" aria-label="Tic Tac Toe"><span>TIC</span> <span>TAC</span> <span>TOE</span></h1><p id="connection" role="status">Connecting...</p><p id="scores" class="sr-only"></p><p id="status" class="game-status" role="status">Waiting for the host...</p></header>
<div class="game-arena"><aside class="game-score-card"><img src="/game/tic-tac-toe/art/x.svg" alt="X"><p id="x-player">Player X</p><strong>WINS</strong><output id="x-score" aria-label="X wins this session">0</output></aside><section class="game-playfield"><div id="board" aria-label="Tic Tac Toe board"></div><button id="replay" class="game-primary" hidden>PLAY AGAIN</button></section><aside class="game-score-card"><img src="/game/tic-tac-toe/art/o.svg" alt="O"><p id="o-player">Player O</p><strong>WINS</strong><output id="o-score" aria-label="O wins this session">0</output></aside></div>
</main><script src="/controller-sdk.js"></script><script src="/game-celebration.js"></script><script src="controller.js"></script></body></html>
