<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <link rel="stylesheet" href="/styles.css">
  <link rel="stylesheet" href="style.css">
  <title>Battleship · The Star Games</title>
</head>
<body class="playful-game game-naval game-admiral">
  <main class="game-controller">
    <header>
      <h1 class="sr-only">Battleship</h1>
      <img class="game-title-art" src="/game/battleship/art/title-v2.png" alt="" aria-hidden="true">
      <p id="connection" role="status">Connecting…</p>
      <p id="status" class="game-status" role="status">Waiting for the host…</p>
    </header>
    <section class="game-playfield">
      <nav class="fleet-tabs" aria-label="Fleet view">
        <button id="show-own" type="button" aria-pressed="false">YOUR FLEET</button>
        <button id="show-enemy" type="button" aria-pressed="true">ENEMY FLEET</button>
      </nav>
      <div class="battle-boards">
        <div class="fleet-slot fleet-secondary"><div id="home-board" class="fleet-board" aria-label="Your fleet"></div></div>
        <div class="fleet-slot"><div id="board" class="fleet-board" aria-label="Battleship playfield"></div></div>
      </div>
      <button id="replay" class="game-primary" type="button" hidden>PLAY AGAIN</button>
      <div id="ready-slot" class="game-board-controls"></div>
    </section>
    <div id="fleet-consoles" class="fleet-consoles">
      <aside id="own-console" class="fleet-console" aria-label="Player fleet monitor">
        <div id="own-fleet-status"><h2>PLAYER FLEET</h2><ul id="own-ships" class="fleet-list" aria-label="Your ships"></ul></div>
        <section id="deployment" class="deployment-controls" aria-label="Fleet deployment" hidden>
          <select id="ship-type" class="game-choice" aria-label="Selected ship. Press and hold a grid cell to rotate.">
            <option value="0">Carrier · 5</option><option value="1">Battleship · 4</option>
            <option value="2">Cruiser · 3</option><option value="3">Submarine · 3</option><option value="4">Destroyer · 2</option>
          </select>
          <button id="auto" type="button">AUTO PLACE</button>
          <div class="deployment-actions"><button id="clear" type="button">CLEAR</button><button id="ready" class="game-primary" type="button" hidden>READY</button></div>
        </section>
      </aside>
      <aside id="enemy-console" class="fleet-console" aria-label="Enemy fleet monitor"><div id="enemy-fleet-status"><h2>ENEMY FLEET</h2><ul id="enemy-ships" class="fleet-list" aria-label="Enemy ships"></ul></div></aside>
    </div>
  </main>
  <script src="/controller-sdk.js"></script>
  <script src="/game-celebration.js"></script>
  <script src="controller.js"></script>
</body>
</html>
