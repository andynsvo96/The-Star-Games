<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <link rel="stylesheet" href="/styles.css">
  <link rel="stylesheet" href="style.css">
  <title>Mafia Controller</title>
</head>
<body class="playful-game game-covert game-story game-noir">
  <main class="game-controller">
    <header>
      <h1 class="game-wordmark">MAFIA</h1>
      <p id="connection" role="status">Connecting…</p>
      <p id="status" class="game-status" role="status">Waiting for the host…</p>
    </header>
    <div id="living-team" class="game-team-reveal game-team-compact game-team-assembly" aria-label="Players; tombstones indicate eliminated players"></div>
    <section id="private-card" class="game-score-card game-text-score">
      <h2 id="phase">GET READY</h2>
      <p id="life" role="status"></p>
      <div class="game-action-stack">
        <div class="game-action-row"><button id="peek" type="button" aria-expanded="false">SHOW ROLE</button></div>
        <div id="secrets" hidden>
          <h2 id="role"></h2>
          <p id="allies"></p>
          <div id="mafia-votes" aria-live="polite"></div>
          <div id="reports"></div>
        </div>
      </div>
    </section>
    <section id="suspect-decisions" class="game-score-card game-text-score" hidden>
      <h2 id="suspect-heading">Suspect players</h2>
      <p id="suspect-status" role="status"></p>
      <div class="game-action-row"><button id="suspect" class="game-primary" type="button">SUSPECT PLAYERS</button><button id="suspect-none" type="button">NO ONE</button></div>
    </section>
    <section id="decisions" class="game-score-card game-text-score" hidden>
      <h2 id="decision-heading"></h2>
      <p id="decision-status" role="status"></p>
      <div class="game-action-row">
        <button id="choose" class="game-primary" type="button">CHOOSE PLAYER</button>
        <button id="pass" type="button">PASS</button>
      </div>
    </section>
    <section id="vote-summary" class="game-score-card game-text-score" hidden><h2>Town voting</h2><div id="ballots" aria-live="polite"></div></section>
    <section id="result" class="game-score-card game-text-score game-result" hidden>
      <h2 id="result-heading"></h2>
      <div id="team" class="game-team-reveal"></div>
      <p id="result-points"></p>
      <div id="role-reveal"></div>
      <p>Waiting for the host to play again.</p>
    </section>
    <details id="instructions" class="game-sidebar"><summary>Instructions</summary>
      <div id="role-instructions"></div>
    </details>
  </main>
  <dialog id="ejection-dialog" class="game-dialog" aria-labelledby="ejection-message">
    <section id="ejection" hidden>
      <div id="ejection-stage"><h2 id="ejection-message" class="game-reveal-message" role="status"></h2><span id="ejected-avatar" class="avatar" aria-hidden="true"></span></div>
    </section>
  </dialog>
  <dialog id="target-dialog" class="game-dialog game-player-dialog" aria-labelledby="target-heading">
    <h2 id="target-heading">Choose a player</h2>
    <div id="target" aria-label="Eligible players"></div>
    <p id="selection" role="status">Choose a player icon</p>
    <div class="game-action-row"><button id="confirm" class="game-primary game-compact-control" type="button" disabled>CONFIRM</button><button id="cancel" class="game-compact-control" type="button">CANCEL</button></div>
  </dialog>
  <script src="/controller-sdk.js"></script>
  <script src="sky.js"></script>
  <script src="controller.js"></script>
</body>
</html>
