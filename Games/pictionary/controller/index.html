<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <link rel="stylesheet" href="/styles.css">
  <link rel="stylesheet" href="style.css">
  <title>Pictionary Controller</title>
</head>
<body class="playful-game game-royal game-studio">
  <main class="game-controller game-canvas-controller pictionary-controller">
    <header>
      <h1 class="sr-only">Pictionary</h1>
      <img class="game-title-art" src="art/title.png" alt="">
      <p id="connection" role="status">Connecting…</p>
      <div class="game-status" id="status"><span id="turn-status">Waiting for the host</span><strong id="timer" class="game-countdown" aria-label="Time remaining">00:00</strong></div>
    </header>
    <section id="private-card" class="game-paper game-private-word-inline" hidden aria-label="Your private word">
      <p id="private-heading">YOUR WORD</p>
      <h2 id="secret"></h2>
      <div id="word-choices" class="game-action-stack" hidden></div>
    </section>
    <section class="game-playfield">
      <div id="board" class="game-drawing-sheet" aria-label="Shared drawing board">
        <div id="hint" aria-label="Word hint"></div>
        <canvas id="drawing" width="1000" height="700" aria-label="Drawing canvas"></canvas>
        <div id="board-message" class="game-paper" hidden role="status"></div>
      </div>
      <div class="game-board-controls">
        <div id="drawing-controls" hidden>
          <div class="game-action-row game-action-compact game-drawing-toolbar game-drawing-toolbar-labelled">
            <button id="undo" type="button" class="game-compact-control">Undo</button>
            <button id="clear" type="button" class="game-compact-control">Clear</button>
            <button id="eraser" type="button" class="game-brush-size game-brush-cycle game-brush-labelled game-compact-control" data-size="medium" aria-pressed="false" aria-label="Eraser: Medium. Activate eraser.">Eraser<span class="game-brush-indicator" aria-hidden="true"><span class="game-brush-dot game-eraser-dot" style="--brush-dot-size:9px"></span></span></button>
            <button id="brush-size" type="button" class="game-brush-size game-brush-cycle game-brush-labelled game-compact-control" data-size="medium" aria-pressed="true" aria-label="Brush size: Medium. Tap for Large.">Brush<span class="game-brush-indicator" aria-hidden="true"><span class="game-brush-dot" style="--brush-dot-size:9px"></span></span></button>
          </div>
          <div class="ink-colors" role="group" aria-label="Ink color">
            <button class="game-ink-swatch" type="button" data-color="0" style="--swatch-color:#263442" aria-label="Black ink" aria-pressed="true"></button>
            <button class="game-ink-swatch" type="button" data-color="1" style="--swatch-color:#286ac2" aria-label="Blue ink" aria-pressed="false"></button>
            <button class="game-ink-swatch" type="button" data-color="2" style="--swatch-color:#d83e43" aria-label="Red ink" aria-pressed="false"></button>
            <button class="game-ink-swatch" type="button" data-color="3" style="--swatch-color:#409348" aria-label="Green ink" aria-pressed="false"></button>
            <button class="game-ink-swatch" type="button" data-color="4" style="--swatch-color:#efbd23" aria-label="Yellow ink" aria-pressed="false"></button>
            <button class="game-ink-swatch" type="button" data-color="5" style="--swatch-color:#88512d" aria-label="Brown ink" aria-pressed="false"></button>
            <button class="game-ink-swatch" type="button" data-color="6" style="--swatch-color:#893fcc" aria-label="Purple ink" aria-pressed="false"></button>
          </div>
        </div>
        <form id="guess-form" class="game-paper game-paper-compact" hidden>
          <label for="guess-input">Your guess</label>
          <div class="game-action-row game-action-compact">
            <input id="guess-input" type="text" placeholder="Type a word" autocomplete="off" autocapitalize="off" spellcheck="false" maxlength="60" required>
            <button id="guess-button" class="game-primary game-compact-control" type="submit">Guess</button>
          </div>
        </form>
        <p id="feedback" class="game-feedback-paper" role="status" aria-live="polite"></p>
      </div>
      <!-- The SDK reserves replay space; starting the next match is host-only. -->
      <button id="replay" type="button" class="game-primary" hidden>Play Again</button>
    </section>
    <div id="side-tools" class="game-board-side-controls" data-game-side-controls></div>
  </main>
  <script src="/controller-sdk.js"></script>
  <script src="controller.js"></script>
</body>
</html>
