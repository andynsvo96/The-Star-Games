<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Four in a Row</title><link rel="stylesheet" href="/styles.css"><link rel="stylesheet" href="style.css"></head>
<body class="playful-game game-arcade"><main class="game-controller"><header><h1 class="sr-only">Four in a Row</h1><img class="game-title-art" src="/game/four-in-a-row/art/title-v2.png" alt=""><p id="connection" role="status">Connecting...</p><p id="scores" class="sr-only"></p><p id="status" class="game-status" role="status">Waiting for the host...</p></header>
<div class="game-arena"><aside class="game-score-card game-hanging"><img src="/game/four-in-a-row/art/red.svg" alt="Red"><p id="x-player">Red player</p><strong>WINS</strong><output id="x-score" aria-label="Red wins this session">0</output></aside><section class="game-playfield"><div id="board" aria-label="Four in a Row board"></div><button id="replay" class="game-primary" hidden>PLAY AGAIN</button></section><aside class="game-score-card game-hanging" style="--score-color: #ffc928"><img src="/game/four-in-a-row/art/yellow.svg" alt="Yellow"><p id="o-player">Yellow player</p><strong>WINS</strong><output id="o-score" aria-label="Yellow wins this session">0</output></aside></div>
</main><script src="/controller-sdk.js"></script><script src="/game-celebration.js"></script><script src="controller.js"></script></body></html>
