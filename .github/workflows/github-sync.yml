name: GitHub Sync Tests

on:
  push:
    paths:
      - tools/**
      - tests/github_sync_test.py
      - .gitignore
      - .github/workflows/github-sync.yml
  pull_request:
    paths:
      - tools/**
      - tests/github_sync_test.py
      - .gitignore
      - .github/workflows/github-sync.yml

permissions:
  contents: read

jobs:
  github-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Test automatic publishing with local Git remotes
        run: python tests/github_sync_test.py
