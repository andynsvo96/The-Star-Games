name: Framework Tests and Export

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    container: barichello/godot-ci:4.7
    steps:
      - uses: actions/checkout@v4
      - name: Import framework and template
        run: godot --headless --editor --path . --quit
      - name: Run framework tests
        run: godot --headless --path . --script res://tests/run_tests.gd
      - name: Run LAN smoke test
        run: godot --headless --path . --script res://tests/network_smoke.gd
      - name: Run private media capability tests
        run: godot --headless --path . --script res://tests/session_media.gd
      - name: Run launcher navigation smoke test
        run: godot --headless --path . --script res://tests/ui_smoke.gd
      - name: Run isolated autoplay debug tests
        run: godot --headless --path . --script res://tests/debug_autoplay.gd
      - name: Run Debug browser detection and selection tests
        run: godot --headless --path . --script res://tests/debug_browsers.gd
      - name: Run template session and identity smoke test
        run: godot --headless --path . --script res://tests/avatar_solo_smoke.gd
      - name: Run lobby and game-selection tests with synthetic modules
        run: |
          godot --headless --path . --script res://tests/lobby_layout.gd
          godot --headless --path . --script res://tests/lobby_smoke.gd
      - name: Run shared game background tests
        run: godot --headless --path . --script res://tests/game_backgrounds.gd
      - name: Run skin lifecycle, editor and LAN tests with a synthetic module
        run: godot --headless --path . --script res://tests/skin_packs_fixture.gd
      - name: Run asset discovery and editor layout tests with synthetic media
        run: godot --headless --path . --script res://tests/asset_editor_fixture.gd

  export:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    container: barichello/godot-ci:4.7
    strategy:
      matrix:
        include:
          - preset: Windows Desktop
            output: builds/windows/TheStarGames.exe
            artifact: TheStarGames-Windows
          - preset: macOS
            output: builds/macos/TheStarGames.zip
            artifact: TheStarGames-macOS
          - preset: Android
            output: builds/android/TheStarGames.apk
            artifact: TheStarGames-Android
    steps:
      - uses: actions/checkout@v4
      - name: Create output directory
        run: mkdir -p "$(dirname '${{ matrix.output }}')"
      - name: Export release build
        run: godot --headless --path . --export-release "${{ matrix.preset }}" "${{ matrix.output }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.output }}*
