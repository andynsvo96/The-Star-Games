<svg xmlns="http://www.w3.org/2000/svg" width="480" height="720"><rect x="2" y="2" width="476" height="716" rx="22" fill="#fffef7" stroke="#b6b8ad" stroke-width="1.2"/><rect x="21" y="22" width="438" height="54" rx="0" fill="#e0e0da" stroke="#263126" stroke-width="1.2"/><rect x="21" y="22" width="14" height="54" rx="0" fill="#c63232" stroke="#263126" stroke-width="1.2"/><text x="246" y="61" font-family="Arial" font-weight="bold" font-size="30" text-anchor="middle" fill="#263126">ESSENTIAL RULES</text><text x="30" y="97" font-family="Arial" font-weight="bold" font-size="20" text-anchor="start" fill="#263126">1. CARDS ON THE TABLE</text><text x="30" y="121" font-family="Arial" font-weight="bold" font-size="19" text-anchor="start" fill="#263126">Never put banked or played cards back into</text><text x="30" y="143" font-family="Arial" font-weight="bold" font-size="19" text-anchor="start" fill="#263126">your hand.</text><text x="30" y="172" font-family="Arial" font-weight="bold" font-size="20" text-anchor="start" fill="#263126">2. PAYING OTHER PLAYERS</text><text x="30" y="196" font-family="Arial" font-weight="bold" font-size="19" text-anchor="start" fill="#263126">Pay from your bank, properties or</text><text x="30" y="218" font-family="Arial" font-weight="bold" font-size="19" text-anchor="start" fill="#263126">buildings. Never pay from your hand. No</text><text x="30" y="240" font-family="Arial" font-weight="bold" font-size="19" text-anchor="start" fill="#263126">change: owe $2, pay $3, they keep $3. If</text><text x="30" y="262" font-family="Arial" font-weight="bold" font-size="19" text-anchor="start" fill="#263126">short, pay all assets with a value. If you</text><text x="30" y="284" font-family="Arial" font-weight="bold" font-size="19" text-anchor="start" fill="#263126">have none, pay nothing.</text><text x="30" y="313" font-family="Arial" font-weight="bold" font-size="20" text-anchor="start" fill="#263126">3. WILD PROPERTIES</text><text x="30" y="337" font-family="Arial" font-weight="bold" font-size="19" text-anchor="start" fill="#263126">Rearrange your played properties on your</text><text x="30" y="359" font-family="Arial" font-weight="bold" font-size="19" text-anchor="start" fill="#263126">turn before your third play. A zero-value</text><text x="30" y="381" font-family="Arial" font-weight="bold" font-size="19" text-anchor="start" fill="#263126">wild cannot pay debts or be banked.</text><text x="30" y="410" font-family="Arial" font-weight="bold" font-size="20" text-anchor="start" fill="#263126">4. BUILDINGS</text><text x="30" y="434" font-family="Arial" font-weight="bold" font-size="19" text-anchor="start" fill="#263126">A House adds $3 rent to a full street set.</text><text x="30" y="456" font-family="Arial" font-weight="bold" font-size="19" text-anchor="start" fill="#263126">A Hotel needs a House and adds $4 more. No</text><text x="30" y="478" font-family="Arial" font-weight="bold" font-size="19" text-anchor="start" fill="#263126">buildings on railroads or utilities.</text><text x="30" y="507" font-family="Arial" font-weight="bold" font-size="20" text-anchor="start" fill="#263126">5. JUST SAY NO</text><text x="30" y="531" font-family="Arial" font-weight="bold" font-size="19" text-anchor="start" fill="#263126">Cancel an action against you, or counter</text><text x="30" y="553" font-family="Arial" font-weight="bold" font-size="19" text-anchor="start" fill="#263126">another No. On your own turn it uses one of</text><text x="30" y="575" font-family="Arial" font-weight="bold" font-size="19" text-anchor="start" fill="#263126">your 3 plays.</text><text x="30" y="604" font-family="Arial" font-weight="bold" font-size="20" text-anchor="start" fill="#263126">RENT DOUBLES</text><text x="30" y="628" font-family="Arial" font-weight="bold" font-size="19" text-anchor="start" fill="#263126">Choose Use with Rent on a Double the Rent</text><text x="30" y="650" font-family="Arial" font-weight="bold" font-size="19" text-anchor="start" fill="#263126">card, then open a Rent card. Each double</text><text x="30" y="672" font-family="Arial" font-weight="bold" font-size="19" text-anchor="start" fill="#263126">uses another play.</text></svg>