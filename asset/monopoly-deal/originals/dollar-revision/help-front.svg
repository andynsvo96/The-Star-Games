<svg xmlns="http://www.w3.org/2000/svg" width="480" height="720"><rect x="2" y="2" width="476" height="716" rx="22" fill="#fffef7" stroke="#b6b8ad" stroke-width="1.2"/><rect x="21" y="22" width="438" height="54" rx="0" fill="#e0e0da" stroke="#263126" stroke-width="1.2"/><rect x="21" y="22" width="14" height="54" rx="0" fill="#c63232" stroke="#263126" stroke-width="1.2"/><text x="246" y="61" font-family="Arial" font-weight="bold" font-size="30" text-anchor="middle" fill="#263126">QUICK START RULES</text><text x="30" y="97" font-family="Arial" font-weight="bold" font-size="20" text-anchor="start" fill="#263126">AIM</text><text x="30" y="121" font-family="Arial" font-weight="bold" font-size="19" text-anchor="start" fill="#263126">Be the first to collect 3 complete property</text><text x="30" y="143" font-family="Arial" font-weight="bold" font-size="19" text-anchor="start" fill="#263126">sets of different colors.</text><text x="30" y="172" font-family="Arial" font-weight="bold" font-size="20" text-anchor="start" fill="#263126">GET READY</text><text x="30" y="196" font-family="Arial" font-weight="bold" font-size="19" text-anchor="start" fill="#263126">Deal 5 cards to each player. Put the rest</text><text x="30" y="218" font-family="Arial" font-weight="bold" font-size="19" text-anchor="start" fill="#263126">face down in the center as the draw pile.</text><text x="30" y="247" font-family="Arial" font-weight="bold" font-size="20" text-anchor="start" fill="#263126">PLAY! ON YOUR TURN</text><text x="30" y="271" font-family="Arial" font-weight="bold" font-size="19" text-anchor="start" fill="#263126">1. Draw 2 cards, or 5 if you begin with an</text><text x="30" y="293" font-family="Arial" font-weight="bold" font-size="19" text-anchor="start" fill="#263126">empty hand.</text><text x="30" y="322" font-family="Arial" font-weight="bold" font-size="19" text-anchor="start" fill="#263126">2. Play up to 3 cards in any combination:</text><text x="30" y="351" font-family="Arial" font-weight="bold" font-size="19" text-anchor="start" fill="#263126">BANK money or action cards. Their printed</text><text x="30" y="373" font-family="Arial" font-weight="bold" font-size="19" text-anchor="start" fill="#263126">value is added to your bank.</text><text x="30" y="402" font-family="Arial" font-weight="bold" font-size="19" text-anchor="start" fill="#263126">ADD property cards face up in front of you.</text><text x="30" y="424" font-family="Arial" font-weight="bold" font-size="19" text-anchor="start" fill="#263126">Properties cannot be banked.</text><text x="30" y="453" font-family="Arial" font-weight="bold" font-size="19" text-anchor="start" fill="#263126">PLAY action cards into the center to use</text><text x="30" y="475" font-family="Arial" font-weight="bold" font-size="19" text-anchor="start" fill="#263126">their effect.</text><text x="30" y="504" font-family="Arial" font-weight="bold" font-size="20" text-anchor="start" fill="#263126">ENDING YOUR TURN</text><text x="30" y="528" font-family="Arial" font-weight="bold" font-size="19" text-anchor="start" fill="#263126">The third play ends your turn after all</text><text x="30" y="550" font-family="Arial" font-weight="bold" font-size="19" text-anchor="start" fill="#263126">responses and payments finish. End turn</text><text x="30" y="572" font-family="Arial" font-weight="bold" font-size="19" text-anchor="start" fill="#263126">lets you stop early. Discard to 7 cards</text><text x="30" y="594" font-family="Arial" font-weight="bold" font-size="19" text-anchor="start" fill="#263126">when asked.</text><text x="30" y="623" font-family="Arial" font-weight="bold" font-size="20" text-anchor="start" fill="#263126">TIP</text><text x="30" y="647" font-family="Arial" font-weight="bold" font-size="19" text-anchor="start" fill="#263126">Keep your bank well stocked. You never know</text><text x="30" y="669" font-family="Arial" font-weight="bold" font-size="19" text-anchor="start" fill="#263126">when you will need to pay!</text></svg>